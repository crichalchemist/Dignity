# Triage: allow / review / block under a 5% review budget
# Train risk first (config/train_risk.yaml): the backbone is warm-started from it.

model:
  task: policy  # risk, forecast, policy
  input_size: 9
  hidden_size: 256
  n_layers: 2
  dropout: 0.1
  cnn_kernel_size: 3
  horizon: 10  # forecast H
  n_actions: 3  # policy; must equal len(ACTIONS)

data:
  source: synthetic  # only "synthetic" in v1.0; other sources are v1.1 (DGNTY-41)
  seq_len: 100
  batch_size: 64
  split: [0.7, 0.15, 0.15]  # train / val / test blocks
  label_overlap: 0.0  # risk positive if anomaly overlap fraction > this
  num_workers: 4
  features:
    - volume
    - fee_rate
    - tx_count
    - volatility
    - price_change
    - momentum
    - directional_change
    - volume_volatility
    - regime
# Event-record generator (data.synthetic) — commented out; every field at default.
# To override, uncomment these lines in place: they nest under data: above.
#   synthetic:
#     n_blocks: 1000
#     block_len: 160              # >= seq_len + horizon + 1
#     contamination: 0.3
#     anomalies_per_block: [1, 3]
#     duration_range: [3, 60]
#     severity_range: [0.3, 1.0]
#     type_weights: {wash_trading: 1.0, pump_and_dump: 1.0, fee_spike: 1.0,
#                    flash_crash: 1.0, layering: 1.0, fee_evasion: 1.0}
#     benign_spike_rate: 0.0
#     label_noise: 0.0
#     regime_switch_prob: 0.0
#     seed: 42

train:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.00001
  use_amp: true
  gradient_clip: 1.0
  checkpoint_dir: ./runs/policy
  save_interval: 5
  select_metric: pr_auc  # ignored for task: policy (selects on neg_cost, the capped val cost)
  pos_weight: null  # ignored for task: policy (the loss is the expected cost)
  chance_guard_auroc: 0.55  # ignored for task: policy (no AUROC for 3 actions)
  guard_epochs: 5
  patience: 10  # early stopping; null disables
  # policy only: risk checkpoint whose backbone warm-starts this run; train risk first
  init_backbone_from: ./runs/risk/best.pt

eval:
  tuning_seed: 1000  # frozen; the model never sees eval_seed before M7
  eval_seed: 2026  # frozen; the model never sees eval_seed before M7
  n_train_seeds: 3
  n_bootstrap: 1000
  epsilons: [0.1, 0.3, 1.0, 3.0, 10.0]
  out_dir: results/v1.0
  img_dir: docs/img

# Triage costs C[action][true state]; review_budget caps the share of windows sent to analysts (blocks do not count).
policy:
  costs:
    allow: {anomaly: 10.0, normal: 0.0}
    review: {anomaly: 1.0, normal: 1.0}
    block: {anomaly: 0.5, normal: 3.0}
  review_budget: 0.05
# Privacy stage (see docs/PRIVACY.md). Runs on raw columns before signals.
# bounds are public parameters chosen a priori. They predate the v1.0 event-record
# generator and do not match its output; M5 (DGNTY-8) re-derives them.
# These values exercise the stage; they are not tuned for model quality
# (noise scale = width/epsilon: 2000 for volume, 1000 for price).
privacy:
  epsilon_total: 1.0
  k: 5
  features:
    volume:   {mechanism: laplace, epsilon: 0.5, bounds: [0, 1000]}
    price:    {mechanism: laplace, epsilon: 0.5, bounds: [0, 500]}
    fee_rate: {mechanism: generalize, bins: 10}
    tx_count: {mechanism: generalize, bins: 10}

device: cuda
seed: 42
