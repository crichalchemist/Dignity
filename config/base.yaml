# Base Dignity Configuration
# This is the default configuration template

model:
  task: risk  # risk, forecast, policy
  input_size: 9
  hidden_size: 256
  n_layers: 2
  dropout: 0.1
  cnn_kernel_size: 3
  horizon: 10  # forecast H
  n_actions: 3  # policy; must equal len(ACTIONS)

data:
  source: synthetic  # only "synthetic" in v1.0; other sources are v1.1 (DGNTY-41)
  seq_len: 100
  batch_size: 64
  split: [0.7, 0.15, 0.15]  # train / val / test blocks
  label_overlap: 0.0  # risk positive if anomaly overlap fraction > this
  num_workers: 4
  features:
    - volume
    - fee_rate
    - tx_count
    - volatility
    - price_change
    - momentum
    - directional_change
    - volume_volatility
    - regime
# Event-record generator (data.synthetic) — commented out; every field at default.
# To override, uncomment these lines in place: they nest under data: above.
#   synthetic:
#     n_blocks: 1000
#     block_len: 160              # >= seq_len + horizon + 1
#     contamination: 0.3
#     anomalies_per_block: [1, 3]
#     duration_range: [3, 60]
#     severity_range: [0.3, 1.0]
#     type_weights: {wash_trading: 1.0, pump_and_dump: 1.0, fee_spike: 1.0,
#                    flash_crash: 1.0, layering: 1.0, fee_evasion: 1.0}
#     benign_spike_rate: 0.0
#     label_noise: 0.0
#     regime_switch_prob: 0.0
#     seed: 42

train:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.00001
  use_amp: true
  gradient_clip: 1.0
  checkpoint_dir: ./runs
  save_interval: 5
  select_metric: pr_auc  # best.pt = highest val PR-AUC
  pos_weight: null  # null = n_neg/n_pos of train
  chance_guard_auroc: 0.55  # warn if val AUROC is below this at guard_epochs; null disables
  guard_epochs: 5
  patience: 10  # early stopping; null disables
  init_backbone_from: null  # policy only: risk checkpoint to warm-start the backbone

eval:
  tuning_seed: 1000  # frozen; the model never sees eval_seed before M7
  eval_seed: 2026  # frozen; the model never sees eval_seed before M7
  n_train_seeds: 3
  n_bootstrap: 1000
  epsilons: [0.1, 0.3, 1.0, 3.0, 10.0]
  out_dir: results/v1.0
  img_dir: docs/img

# Triage costs C[action][true state]; review_budget caps the share of windows sent to analysts (blocks do not count).
policy:
  costs:
    allow: {anomaly: 10.0, normal: 0.0}
    review: {anomaly: 1.0, normal: 1.0}
    block: {anomaly: 0.5, normal: 3.0}
  review_budget: 0.05
# Privacy stage — commented out by default. No block => no privacy stage runs.
# See docs/PRIVACY.md for what each mechanism guarantees.
# privacy:
#   key_env: DIGNITY_PRIVACY_KEY     # env var NAME of the HMAC key; only used by
#                                     # pseudonymize(), no column mechanism reads it
#   epsilon_total: 1.0
#   k: 5
#   deterministic_rng: false   # true = seeded experiment mode (reproducible, NOT DP-grade randomness)
#   features:
#     volume:   {mechanism: laplace, epsilon: 0.5, bounds: [0, 10000]}
#     price:    {mechanism: laplace, epsilon: 0.5, bounds: [0, 1000]}
#     fee_rate: {mechanism: generalize, bins: 10}

device: cuda
seed: 42
