# Synthetic preset: medium
# Full config (base sections plus data.synthetic). Tuned on the tuning seed (M2.14)
# and frozen for M3-M7.

model:
  task: risk  # risk, forecast, policy
  input_size: 9
  hidden_size: 256
  n_layers: 2
  dropout: 0.1
  cnn_kernel_size: 3
  horizon: 10  # forecast H

data:
  source: synthetic  # only "synthetic" in v1.0; other sources are v1.1 (DGNTY-41)
  seq_len: 100
  batch_size: 64
  split: [0.45, 0.15, 0.40]  # train / val / test blocks
  label_overlap: 0.0  # risk positive if anomaly overlap fraction > this
  num_workers: 4
  features:
    - volume
    - fee_rate
    - tx_count
    - volatility
    - price_change
    - momentum
    - directional_change
    - volume_volatility
    - regime
  synthetic:
    n_blocks: 3000              # 45/15/40 split leaves over 200 test onsets
    block_len: 160              # >= seq_len + horizon + 1
    contamination: 0.3
    anomalies_per_block: [1, 2]
    duration_range: [10, 60]
    severity_range: [0.6, 1.0]
    benign_spike_rate: 0.1
    label_noise: 0.0
    regime_switch_prob: 0.005
    precursor_strength: 0.7       # build-up strength before four anomaly types (provisional)
    precursor_len_range: [10, 30]  # rows a build-up spans before its anomaly
    decoy_rate: 0.2             # P(a block holds one build-up that nothing follows)

train:
  epochs: 50
  lr: 0.0003
  weight_decay: 0.00001
  use_amp: true
  gradient_clip: 1.0
  checkpoint_dir: ./runs/medium
  save_interval: 5

device: cuda
seed: 42
