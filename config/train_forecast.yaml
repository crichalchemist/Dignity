# Forecasting Configuration
# Early warning: P(a new anomaly starts within 1..H rows)

model:
  task: forecast
  horizon: 10
  input_size: 9
  hidden_size: 512  # Larger for forecasting
  n_layers: 3  # Deeper for temporal patterns
  dropout: 0.1
  cnn_kernel_size: 5  # Larger receptive field

data:
  source: synthetic
  seq_len: 200  # longer context for early warning; block_len 260 >= seq_len + horizon + 1
  batch_size: 32  # Smaller batch for memory
  split: [0.45, 0.15, 0.40]  # train / val / test blocks
  synthetic:
    block_len: 260  # seq_len 200 + horizon 10 + slack
  num_workers: 4
  features:
    - volume
    - price
    - fee_rate
    - tx_count
    - volatility
    - price_change
    - momentum
    - directional_change
    - volume_volatility

train:
  epochs: 75
  lr: 0.0005
  weight_decay: 0.00001
  use_amp: true
  gradient_clip: 1.0
  checkpoint_dir: ./runs/forecast
  save_interval: 5

device: cuda
seed: 42
