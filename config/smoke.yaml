# Smoke preset: CI runs `python -m eval.run --smoke --seed tuning --privacy-sweep`
# (< 60 s on CPU).
# Outputs stay under runs/ so a smoke run never touches results/v1.0 or docs/img.
model: {task: risk, hidden_size: 16, n_layers: 1, dropout: 0.1, cnn_kernel_size: 3, horizon: 10}
data:
  source: synthetic
  seq_len: 50
  batch_size: 64
  num_workers: 0
  split: [0.45, 0.15, 0.40]
  label_overlap: 0.0
  synthetic: {n_blocks: 60, block_len: 120, contamination: 0.5, seed: 1000, precursor_strength: 0.9, decoy_rate: 0.2}
train: {epochs: 1, use_amp: false, checkpoint_dir: runs/smoke/train, save_interval: 1,
        guard_epochs: 1, chance_guard_auroc: null, patience: null,
        forecast_eligibility: false}
eval: {n_train_seeds: 1, n_bootstrap: 50, epsilons: [1.0], out_dir: runs/smoke/results, img_dir: runs/smoke/img}
device: cpu
seed: 42
