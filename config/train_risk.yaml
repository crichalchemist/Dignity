# Risk Scoring Configuration
# Optimized for transaction risk assessment

model:
  task: risk
  input_size: 9
  hidden_size: 256
  n_layers: 2
  dropout: 0.2  # Higher dropout for risk task
  cnn_kernel_size: 3

data:
  source: synthetic
  seq_len: 100
  batch_size: 64
  split: [0.7, 0.15, 0.15]  # train / val / test blocks
  num_workers: 4
  features:
    - volume
    - fee_rate
    - tx_count
    - volume_volatility

train:
  epochs: 100  # More epochs for risk task
  lr: 0.0001  # Lower LR for stability
  weight_decay: 0.0001  # Stronger regularization
  use_amp: true
  gradient_clip: 0.5
  checkpoint_dir: ./runs/risk
  save_interval: 10

# Privacy stage (docs/PRIVACY.md). Bounds are public: public_log1p_volume_bounds()
# of this file's data.synthetic, from declared generator parameters, never data.
# Levers used: all epsilon on volume, log1p before noising, price not released.
privacy:
  epsilon_total: 1.0
  k: 5
  features:
    volume:   {mechanism: laplace, epsilon: 1.0, transform: log1p, bounds: [0.12, 13.14]}
    fee_rate: {mechanism: generalize, bins: 10}
    tx_count: {mechanism: generalize, bins: 10}

device: cuda
seed: 42
